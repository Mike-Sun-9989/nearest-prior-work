[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nearest-prior-work"
version = "0.3.6"
description = "Local section-level literature similarity search with a bundled index, browser interface and agent tools."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "DATA_NOTICE.md"]
authors = [{ name = "Anonymous for review" }]
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.27",
    "python-docx>=1.1",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14",
    "sentence-transformers==5.6.0",
    "torch==2.11.0",
    "starlette>=0.37",
    "uvicorn>=0.29",
    "anyio>=4",
]

[project.optional-dependencies]
local = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14",
    "sentence-transformers==5.6.0",
    "torch==2.11.0",
]
server = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14",
    "sentence-transformers==5.6.0",
    "torch==2.11.0",
    "starlette>=0.37",
    "uvicorn>=0.29",
    "anyio>=4",
]
test = ["pytest>=8", "numpy>=1.26", "pandas>=2.0", "pyarrow>=14", "starlette>=0.37", "anyio>=4"]

[project.scripts]
npw = "nearest_prior_work.server.__main__:main"
npw-mcp = "nearest_prior_work.mcp_client:main"
npw-server = "nearest_prior_work.server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"nearest_prior_work.server" = ["static/*.html", "static/*.js"]
"nearest_prior_work" = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
